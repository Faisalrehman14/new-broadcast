services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pagebroadcast
      POSTGRES_PASSWORD: pagebroadcast
      POSTGRES_DB: pagebroadcast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagebroadcast"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pagebroadcast:pagebroadcast@postgres:5432/pagebroadcast?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pagebroadcast:pagebroadcast@postgres:5432/pagebroadcast?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
